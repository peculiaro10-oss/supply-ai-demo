<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Cauldra Ops Console</title>
<script src="/assets/vendor/tailwindcss-3.4.17.js"></script>
<link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    bgMain: '#070B14', sidebarBg: '#0A0F1D', cardBg: '#0D1322', cardHover: '#131C31',
                    borderCol: '#172033', primary: '#436BEE', primaryHover: '#375BCC',
                    textMain: '#E2E8F0', textSec: '#7C8BA1',
                    success: '#1CA850', warning: '#EAB308', danger: '#D94141',
                },
                fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
            },
        },
    };
</script>
<style>
    body { background: #070B14; color: #E2E8F0; font-family: Inter, system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070B14; }
    ::-webkit-scrollbar-thumb { background: #172033; border-radius: 4px; }
    .bar-track { background: #131C31; border-radius: 999px; overflow: hidden; height: 8px; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width .3s ease; }
    [data-view] { display: none; }
    [data-view].active { display: block; }
    .stat-card { background: #0D1322; border: 1px solid #172033; border-radius: 1rem; padding: 1rem 1.15rem; }
    .stat-value { font-size: 1.5rem; font-weight: 800; color: #E2E8F0; line-height: 1.15; }
    .stat-label { font-size: 11px; color: #7C8BA1; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.data-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #7C8BA1; font-weight: 700; padding: 8px 10px; border-bottom: 1px solid #172033; white-space: nowrap; }
    table.data-table td { padding: 9px 10px; border-bottom: 1px solid #131C31; color: #E2E8F0; vertical-align: middle; }
    table.data-table tbody tr:hover { background: #0D1322; }
    .table-scroll { overflow-x: auto; border: 1px solid #172033; border-radius: .85rem; }
    .pill { display: inline-flex; align-items: center; gap: .3rem; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
    /* #sidebar is `position:fixed` on mobile (see index.html), so it is NOT
       part of the page's normal scroll flow - if its own height is taller
       than the real visible viewport, the portion below the fold (the
       Sign Out footer) becomes unreachable by scrolling. `100vh` on mobile
       browsers is measured against the LARGEST possible viewport (as if the
       address bar were hidden), which is routinely taller than what's
       actually visible - `100dvh` tracks the real, currently-visible
       viewport instead. The vh line stays first as a fallback for browsers
       that don't understand `dvh` (they simply ignore the second,
       unrecognized declaration and keep the first). ID specificity means
       this reliably overrides the `.h-screen` utility class already on the
       element, in either declaration order. */
    #sidebar { height: 100vh; height: 100dvh; }
    /* Safe-area inset is 0 on devices without one, so this adds no extra
       spacing on ordinary phones/desktops - it only pushes Sign Out clear of
       the home-indicator gesture area on devices that have one. */
    #sidebar-footer { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
</style>
</head>
<body class="min-h-screen">

<!-- ============================== LOGIN ============================== -->
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="flex items-center gap-2.5 justify-center mb-6">
            <img src="/assets/cauldra-logo.png" alt="" class="w-9 h-9 rounded-lg object-contain">
            <span class="font-extrabold text-sm tracking-wide uppercase text-textMain">Cauldra Ops</span>
        </div>
        <div class="bg-cardBg border border-borderCol rounded-2xl p-6 shadow-2xl">
            <div id="login-status" class="hidden mb-3 px-3 py-2 rounded-xl border text-[11px]"></div>

            <!-- Step 1: email + password -->
            <form id="login-form-password" class="space-y-3">
                <h1 class="font-bold text-sm text-textMain mb-1">Platform Owner Sign In</h1>
                <div>
                    <label class="block font-medium text-textSec mb-1 text-xs">Email</label>
                    <input type="email" id="login-email" required autocomplete="username" class="w-full bg-bgMain border border-borderCol rounded-xl px-3 py-2 text-xs text-textMain focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block font-medium text-textSec mb-1 text-xs">Password</label>
                    <input type="password" id="login-password" required autocomplete="current-password" class="w-full bg-bgMain border border-borderCol rounded-xl px-3 py-2 text-xs text-textMain focus:outline-none focus:border-primary">
                </div>
                <button type="submit" id="login-submit-btn" class="w-full bg-primary hover:bg-primaryHover text-white py-2.5 rounded-xl font-semibold text-xs transition shadow-md cursor-pointer">Continue</button>
            </form>

            <!-- Step 2: TOTP -->
            <form id="login-form-mfa" class="space-y-3 hidden">
                <h1 class="font-bold text-sm text-textMain mb-1">Authentication Code</h1>
                <p class="text-[11px] text-textSec leading-relaxed">Enter the 6-digit code from your authenticator app.</p>
                <div>
                    <input type="text" id="login-mfa-code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"
                           class="w-full bg-bgMain border border-borderCol rounded-xl px-3 py-2 text-center text-lg tracking-[0.4em] font-mono text-textMain focus:outline-none focus:border-primary" placeholder="000000">
                </div>
                <button type="submit" id="mfa-submit-btn" class="w-full bg-primary hover:bg-primaryHover text-white py-2.5 rounded-xl font-semibold text-xs transition shadow-md cursor-pointer">Verify</button>
                <button type="button" id="mfa-back-btn" class="w-full text-textSec hover:text-textMain text-[11px] font-medium cursor-pointer">Back</button>
            </form>
        </div>
    </div>
</div>

<!-- The console itself (console.html + console.js) is served only to a
     signed-in Platform Owner; this page carries nothing but sign-in. -->
<div id="console-root"></div>

<script src="login.js"></script>
</body>
</html>
