<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cauldra offline unlock closure verification</title><link rel="stylesheet" href="/css/offline.css">
<style>body{margin:0;min-height:100vh;background:#0d1713;color:#f5f7f6;font:15px/1.5 system-ui}.results{box-sizing:border-box;padding:16px;max-width:900px;margin:auto;overflow-wrap:anywhere}.pass{color:#86efac}.fail{color:#fca5a5}</style></head>
<body><main class="results"><h1>Offline unlock closure checks</h1><ol id="results" aria-live="polite"></ol></main>
<script>
window.__cauldraBiometricMock={mode:"success",unlockCalls:0,enableCalls:0,envelopes:new Map()};
window.Capacitor={Plugins:{
 App:{addListener:async()=>({remove(){}})},
 CauldraBiometric:{
  async getStatus({scope}){const mock=window.__cauldraBiometricMock;return{available:mock.mode!=="unavailable",enabled:mock.envelopes.has(scope),reason:mock.mode}},
  async enable({scope,secret}){const mock=window.__cauldraBiometricMock;mock.enableCalls+=1;if(mock.mode!=="success")return{status:mock.mode,scope};mock.envelopes.set(scope,secret);return{status:"success",scope}},
  async unlock({scope}){const mock=window.__cauldraBiometricMock;mock.unlockCalls+=1;if(mock.mode!=="success")return{status:mock.mode,scope};return mock.envelopes.has(scope)?{status:"success",scope,secret:mock.envelopes.get(scope)}:{status:"unavailable",scope}},
  async disable({scope}){window.__cauldraBiometricMock.envelopes.delete(scope);return{status:"success",scope}}
 }
}};
</script>
<script src="/js/offline.js"></script><script>
(async()=>{const list=document.getElementById('results');const report=(name,ok,detail='')=>{const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=`${ok?'PASS':'FAIL'} — ${name}${detail?' — '+detail:''}`;list.appendChild(li)};
try{
 if(document.readyState==='loading')await new Promise(resolve=>addEventListener('DOMContentLoaded',resolve,{once:true}));
 const mock=window.__cauldraBiometricMock;
 await CauldraOffline.requestColdStart();const preflightDialog=document.getElementById('offline-unlock-dialog');
 report('first-time offline device exposes no workspace',preflightDialog.open&&/internet connection.*required/i.test(preflightDialog.textContent)&&document.getElementById('offline-workspace-fields').hidden);
 report('biometrics are not invoked without prior opt-in',mock.unlockCalls===0);
 const user={id:10,business_id:1,username:'admin',firstname:'Ada',lastname:'Okafor',role:'admin',auth_version:1};
 const business={id:1,business_id:1,company_name:'Cauldra Test Shop',currency:'NGN',timezone:'Africa/Lagos'};
 const firstStatus=await CauldraOffline.sessionStatus(user,business);const offered=await CauldraOffline.offerOptIn({apiUrl:'',token:'test',user,business});
 report('never-enrolled authenticated scope receives one opt-in',firstStatus.opt_in_state==='never_prompted'&&offered&&document.getElementById('offline-opt-in-dialog').open);
 document.getElementById('offline-opt-in-not-now').click();await new Promise(resolve=>setTimeout(resolve,0));
 const declined=await CauldraOffline.sessionStatus(user,business);const repeated=await CauldraOffline.offerOptIn({apiUrl:'',token:'test',user,business});
 report('Not Now provisions nothing and does not repeat',declined.opt_in_state==='declined'&&!declined.identity&&!repeated);
 const userB={...user,id:11,username:'manager'};const independent=await CauldraOffline.sessionStatus(userB,business);
 report('one user decline does not affect another user',independent.opt_in_state==='never_prompted');
 await CauldraOffline.offerOptIn({apiUrl:'',token:'test',user:userB,business});document.getElementById('offline-opt-in-enable').click();
 report('Enable routes into the canonical PIN setup',document.getElementById('offline-setup-dialog').open);document.getElementById('offline-setup-dialog').close();
 await CauldraOffline.provision({apiUrl:'',token:'test',user,business,pin:'123456'});report('mandatory PIN provisions signed grant and encrypted snapshot',true);
 report('already enrolled scope is not prompted again',!(await CauldraOffline.offerOptIn({apiUrl:'',token:'test',user,business})));
 let identity=(await CauldraOffline.listIdentities())[0];const scope=identity.scope;let binding=identity.scope;
 report('offline identity is bound to business, user, and device',scope.startsWith('1:10:')&&scope.endsWith(identity.device_id)&&identity.device_id.length===36);
 const beforeEnable=mock.unlockCalls;CauldraOffline.lock();await CauldraOffline.requestColdStart();
 report('PIN-only trusted device does not trigger biometrics',mock.unlockCalls===beforeEnable&&document.getElementById('offline-biometric-unlock').hidden);
 let wrong=false;try{await CauldraOffline.unlock(scope,'000000',{offline:true})}catch(e){wrong=/incorrect/.test(e.message)}report('wrong PIN rejected',wrong);
 for(let attempt=0;attempt<4;attempt+=1){try{await CauldraOffline.unlock(scope,'000000',{offline:true})}catch(_){}}
 let locked=false;try{await CauldraOffline.unlock(scope,'123456',{offline:true})}catch(e){locked=/too many|locked/i.test(e.message)}report('repeated wrong PIN attempts trigger temporary lockout',locked);
 await CauldraOffline.refreshAccess({apiUrl:'',token:'test',user,business});
 const unlocked=await CauldraOffline.unlock(scope,'123456',{offline:true});report('correct PIN unwraps the scoped workspace',unlocked.snapshot.business.id===1);
 identity=(await CauldraOffline.listIdentities())[0];binding=identity.scope;
 const enableCalls=mock.enableCalls;await CauldraOffline.enableBiometrics();report('explicit opt-in invokes native biometric enable',mock.enableCalls===enableCalls+1);
 CauldraOffline.lock();const bioSuccess=await CauldraOffline.unlockWithBiometric(scope);report('native biometric success releases the correct workspace key',bioSuccess.status==='success'&&bioSuccess.snapshot?.business?.id===1);
 mock.mode='cancelled';CauldraOffline.lock();const cancelled=await CauldraOffline.unlockWithBiometric(scope);const pinAfterCancel=await CauldraOffline.unlock(scope,'123456',{offline:true});report('biometric cancellation falls back to PIN',cancelled.status==='cancelled'&&pinAfterCancel.snapshot.business.id===1);
 mock.mode='unavailable';CauldraOffline.lock();const unavailable=await CauldraOffline.unlockWithBiometric(scope);const pinAfterUnavailable=await CauldraOffline.unlock(scope,'123456',{offline:true});report('unavailable biometrics fall back to PIN',unavailable.status==='unavailable'&&pinAfterUnavailable.snapshot.business.id===1);
 mock.mode='invalidated';CauldraOffline.lock();const invalidated=await CauldraOffline.unlockWithBiometric(scope);const pinAfterInvalidation=await CauldraOffline.unlock(scope,'123456',{offline:true});report('invalidated native key disables biometrics and preserves PIN fallback',invalidated.status==='invalidated'&&pinAfterInvalidation.snapshot.business.id===1&&!(await CauldraOffline.listIdentities())[0].biometric_enabled);
 mock.mode='success';await CauldraOffline.enableBiometrics();await CauldraOffline.disableBiometrics(scope);CauldraOffline.lock();const pinAfterDisable=await CauldraOffline.unlock(scope,'123456',{offline:true});report('disabling biometrics leaves the mandatory PIN usable',pinAfterDisable.snapshot.business.id===1&&!mock.envelopes.has(binding));
 const realNow=Date.now;CauldraOffline.lock();Date.now=()=>realNow()+8*24*60*60*1000;let expired=false;try{await CauldraOffline.unlock(scope,'123456',{offline:true})}catch(e){expired=/expired/.test(e.message)}Date.now=realNow;report('expired offline authorization requires internet',expired);
 await CauldraOffline.refreshAccess({apiUrl:'',token:'test',user,business});
 const grantDb=await CauldraOffline.openDb();await new Promise((resolve,reject)=>{const tx=grantDb.transaction('offline_identities','readwrite');const store=tx.objectStore('offline_identities');const get=store.get(scope);get.onsuccess=()=>{const row=get.result;row.sealed_grant.data=row.sealed_grant.data.slice(0,-2)+'AA';store.put(row)};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
 CauldraOffline.lock();let grantTamper=false;try{await CauldraOffline.unlock(scope,'123456',{offline:true})}catch(e){grantTamper=/integrity/.test(e.message)}report('tampered offline authorization rejected',grantTamper);
 await CauldraOffline.refreshAccess({apiUrl:'',token:'test',user,business});await CauldraOffline.unlock(scope,'123456',{offline:true});
 await CauldraOffline.enqueue({op_id:crypto.randomUUID(),type:'sale_checkout',payload:{items:[]},created_at:Date.now()});
 const rows=await CauldraOffline.listOutbox();await CauldraOffline.updateOutbox(rows[0].op_id,{status:'conflict',conflict_code:'STOCK_CHANGED',last_error:'Server stock is lower than the saved offline sale.'});report('encrypted durable outbox round-trip',rows.length===1);
 await CauldraOffline.removeCurrentData(scope);const removeDialog=document.getElementById('offline-remove-dialog');const beforeCancel=await CauldraOffline.listIdentities();
 report('Remove Offline Data opens a stronger unsynced confirmation without deleting',removeDialog.open&&/1 unsynced change/.test(removeDialog.textContent)&&beforeCancel.some(item=>item.scope===scope));
 document.getElementById('offline-remove-cancel').click();await new Promise(resolve=>setTimeout(resolve,0));report('Keep Data preserves the scoped workspace and outbox',(await CauldraOffline.listIdentities()).some(item=>item.scope===scope)&&(await CauldraOffline.listOutbox()).length===1);
 if(preflightDialog.open)preflightDialog.close();await CauldraOffline.openSyncDetails();report('accessible conflict center rendered',document.querySelectorAll('#offline-conflict-list article').length===1);document.getElementById('offline-sync-dialog').close();
 const db=await CauldraOffline.openDb();await new Promise((resolve,reject)=>{const tx=db.transaction('secure_cache','readwrite');const store=tx.objectStore('secure_cache');const get=store.get(`${scope}:snapshot`);get.onsuccess=()=>{const row=get.result;row.sealed.data=row.sealed.data.slice(0,-2)+'AA';store.put(row)};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
 CauldraOffline.lock();let tamper=false;try{await CauldraOffline.unlock(scope,'123456',{offline:true})}catch(e){tamper=/integrity/.test(e.message)}report('tampered encrypted cache rejected',tamper);
 await CauldraOffline.refreshAccess({apiUrl:'',token:'test',user,business});await CauldraOffline.removeCurrentData(scope);const removeConfirm=document.getElementById('offline-remove-confirm');removeConfirm.click();removeConfirm.click();await new Promise(resolve=>setTimeout(resolve,100));const afterRemove=await CauldraOffline.listIdentities();
 report('confirmed removal executes once for the exact active workspace',afterRemove.length===0&&!document.getElementById('offline-remove-dialog').open);
 await CauldraOffline.requestColdStart();const dialog=document.getElementById('offline-unlock-dialog');report('responsive offline unlock dialog rendered',dialog.open);
 const rect=dialog.getBoundingClientRect();const controls=[...dialog.querySelectorAll('button:not([hidden]),input:not([hidden]),select:not([hidden])')].filter(control=>control.getClientRects().length);const layoutOk=document.documentElement.scrollWidth<=innerWidth+1&&rect.left>=-1&&rect.right<=innerWidth+1&&rect.top>=-1&&rect.bottom<=innerHeight+1&&controls.every(control=>control.getBoundingClientRect().height>=43);
 report(`viewport ${innerWidth}x${innerHeight} has no overflow and usable controls`,layoutOk);document.body.dataset.viewport=`${innerWidth}x${innerHeight}`;document.body.dataset.browserChecks='complete';
}catch(e){report('harness completed',false,e.message);document.body.dataset.browserChecks='failed'}})();
</script></body></html>
